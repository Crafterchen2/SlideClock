<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="index.css" rel="stylesheet">
    <title>Mesh Gradient</title>
    <style type="text/css">
        .root {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background-color: #030014;
        }

        .orbs {
            position: absolute;
            inset: 0;
        }

        .orb1 {
            position: absolute;
            border-radius: 3.40282e38px;
            height: 60%;
            width: 60%;
            left: -10%;
            top: -10%;
            background: radial-gradient(circle, #7c3aed40 0%, transparent 70%);
            filter: blur(80px);
            animation: meshMove1 60s ease-in-out infinite;
        }

        .orb2 {
            position: absolute;
            border-radius: 3.40282e38px;
            height: 50%;
            width: 50%;
            right: -5%;
            top: -10%;
            background: radial-gradient(circle, #2563eb35 0%, transparent 70%);
            filter: blur(100px);
            animation: meshMove2 80s ease-in-out infinite;
        }

        .orb3 {
            position: absolute;
            border-radius: 3.40282e38px;
            height: 55%;
            width: 70%;
            left: 20%;
            bottom: -15%;
            background: radial-gradient(circle, #06b6d430 0%, transparent 70%);
            filter: blur(120px);
            animation: meshMove3 90s ease-in-out infinite;
        }

        .orb4 {
            position: absolute;
            border-radius: 3.40282e38px;
            height: 40%;
            width: 40%;
            left: 40%;
            top: 30%;
            background: radial-gradient(circle, #8b5cf625 0%, transparent 70%);
            filter: blur(90px);
            animation: meshMove4 70s ease-in-out infinite;
        }

        .noise {
            pointer-events: none;
            position: absolute;
            inset: 0;
            opacity: 0.03;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
        }

        main {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
        }

        @keyframes meshMove1 {
            0%,
            100% {
                transform: translate(0%, 0%) scale(1);
            }
            25% {
                transform: translate(5%, 10%) scale(1.05);
            }
            50% {
                transform: translate(10%, 5%) scale(0.95);
            }
            75% {
                transform: translate(5%, -5%) scale(1.02);
            }
        }
        @keyframes meshMove2 {
            0%,
            100% {
                transform: translate(0%, 0%) scale(1);
            }
            33% {
                transform: translate(-10%, 8%) scale(1.08);
            }
            66% {
                transform: translate(-5%, -5%) scale(0.95);
            }
        }
        @keyframes meshMove3 {
            0%,
            100% {
                transform: translate(0%, 0%) scale(1);
            }
            50% {
                transform: translate(-8%, -10%) scale(1.1);
            }
        }
        @keyframes meshMove4 {
            0%,
            100% {
                transform: translate(0%, 0%) scale(1);
            }
            25% {
                transform: translate(15%, -10%) scale(0.9);
            }
            50% {
                transform: translate(-10%, 15%) scale(1.1);
            }
            75% {
                transform: translate(-15%, -5%) scale(0.95);
            }
        }
    </style>
</head>
<body>
<div class="root">
    <div class="orbs">
        <div class="orb1"></div>
        <div class="orb2"></div>
        <div class="orb3"></div>
        <div class="orb4"></div>
    </div>
    <div class="noise"></div>
</div>
<main>
    <div class="clock">
        <div class="hr">
            <div class="strip">
                <button class="number" onclick="stripSlider(0,0,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(0,0,10)" type="button">1</button>
                <button class="number" onclick="stripSlider(0,0,20)" type="button">2</button>
            </div>
            <div class="strip">
                <button class="number" onclick="stripSlider(1,0,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(1,0,1)" type="button">1</button>
                <button class="number" onclick="stripSlider(1,0,2)" type="button">2</button>
                <button class="number" onclick="stripSlider(1,0,3)" type="button">3</button>
                <button class="number" onclick="stripSlider(1,0,4)" type="button">4</button>
                <button class="number" onclick="stripSlider(1,0,5)" type="button">5</button>
                <button class="number" onclick="stripSlider(1,0,6)" type="button">6</button>
                <button class="number" onclick="stripSlider(1,0,7)" type="button">7</button>
                <button class="number" onclick="stripSlider(1,0,8)" type="button">8</button>
                <button class="number" onclick="stripSlider(1,0,9)" type="button">9</button>
            </div>
        </div>
        <div class="min">
            <div class="strip">
                <button class="number" onclick="stripSlider(2,1,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(2,1,10)" type="button">1</button>
                <button class="number" onclick="stripSlider(2,1,20)" type="button">2</button>
                <button class="number" onclick="stripSlider(2,1,30)" type="button">3</button>
                <button class="number" onclick="stripSlider(2,1,40)" type="button">4</button>
                <button class="number" onclick="stripSlider(2,1,50)" type="button">5</button>
            </div>
            <div class="strip">
                <button class="number" onclick="stripSlider(3,1,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(3,1,1)" type="button">1</button>
                <button class="number" onclick="stripSlider(3,1,2)" type="button">2</button>
                <button class="number" onclick="stripSlider(3,1,3)" type="button">3</button>
                <button class="number" onclick="stripSlider(3,1,4)" type="button">4</button>
                <button class="number" onclick="stripSlider(3,1,5)" type="button">5</button>
                <button class="number" onclick="stripSlider(3,1,6)" type="button">6</button>
                <button class="number" onclick="stripSlider(3,1,7)" type="button">7</button>
                <button class="number" onclick="stripSlider(3,1,8)" type="button">8</button>
                <button class="number" onclick="stripSlider(3,1,9)" type="button">9</button>
            </div>
        </div>
        <div class="sec">
            <div class="strip">
                <button class="number" onclick="stripSlider(4,2,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(4,2,10)" type="button">1</button>
                <button class="number" onclick="stripSlider(4,2,20)" type="button">2</button>
                <button class="number" onclick="stripSlider(4,2,30)" type="button">3</button>
                <button class="number" onclick="stripSlider(4,2,40)" type="button">4</button>
                <button class="number" onclick="stripSlider(4,2,50)" type="button">5</button>
            </div>
            <div class="strip">
                <button class="number" onclick="stripSlider(5,2,0)" type="button">0</button>
                <button class="number" onclick="stripSlider(5,2,1)" type="button">1</button>
                <button class="number" onclick="stripSlider(5,2,2)" type="button">2</button>
                <button class="number" onclick="stripSlider(5,2,3)" type="button">3</button>
                <button class="number" onclick="stripSlider(5,2,4)" type="button">4</button>
                <button class="number" onclick="stripSlider(5,2,5)" type="button">5</button>
                <button class="number" onclick="stripSlider(5,2,6)" type="button">6</button>
                <button class="number" onclick="stripSlider(5,2,7)" type="button">7</button>
                <button class="number" onclick="stripSlider(5,2,8)" type="button">8</button>
                <button class="number" onclick="stripSlider(5,2,9)" type="button">9</button>
            </div>
        </div>
    </div>
    <div class="alarm" ></div>
    <div class="playerContainer">
        <div class="player" onclick="togglePlayerBig()">
            <img alt="thumbnail" class="thumbnail" src="resources/noTrack.jpg">
            <div class="text-container">
                <div class="title"></div>
                <div class="desc"></div>
            </div>
        </div>
    </div>
    <div class="menuHandleButton" onclick="toggleMenu()">
        <div class="menuHandle">☰</div>
    </div>
    <div class="blocker"></div>
    <div class="menu">
        <button class="inMenuButton" onclick="stripToZero()" type="button">0</button>
        <button class="inMenuButton" onclick="toggleTimer()" type="button">⌛</button>
        <button class="inMenuButton" onclick="toggleStopwatch()" type="button">⏱</button>
        <button class="inMenuButton" onclick="showBlocker()" type="button">🌑</button>
    </div>
    <script charset="utf-8" src="js/settings.js" type="text/javascript"></script>
    <script charset="utf-8" src="js/player.js" type="text/javascript"></script>
    <script charset="utf-8" src="js/menu.js" type="text/javascript"></script>
    <script charset="utf-8" src="js/sliderClock.js" type="text/javascript"></script>
</main>
</body>
</html>
